id: IOS-AVL-001
version: 1.0.0
name: "Contadores acumulados de errores elevados"
category: "Disponibilidad"
description: "Contadores acumulados de errores elevados; contrato acotado en registro-expansion-operacional-evaluacion-2.md."
default_severity: MEDIUM
required_sources:
  - show interfaces
applicable_platforms:
