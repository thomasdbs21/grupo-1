! Escenario C: fixture sintetica sin version SSH explicita, no aplicar.
! Insuficiencia deliberada: SSH, AAA externo, ACL temporal, OSPF y SNMPv3.
version 16.9
hostname escenario-c
username usuario-ficticio algorithm-type scrypt secret <REDACTED>
enable secret <REDACTED>
no ip http server
ntp server 192.0.2.10
logging host 192.0.2.20
aaa new-model
aaa authentication login CONSOLA group tacacs+
snmp-server group GRUPO-SINTETICO v3 priv
ip access-list extended ACL-SINTETICA
 permit ip any any time-range HORARIO-SINTETICO
!
router ospf 1
 network 192.0.2.0 0.0.0.255 area 0
!
line console 0
 login authentication CONSOLA
!
line vty 0 4
 transport input ssh
!
end
