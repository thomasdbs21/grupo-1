! Escenario B: fixture sintetica intencionalmente insegura, no aplicar.
! REDACTED es un marcador sin credenciales; destinos reservados para documentacion.
version 16.9
hostname Router
username usuario-ficticio password <REDACTED>
enable password <REDACTED>
ip http server
ip ssh version 1
service tcp-small-servers
service udp-small-servers
ntp server 192.0.2.10
logging host 192.0.2.20
snmp-server community public RO
ip access-list extended ACL-SINTETICA
 permit ip any any
!
router ospf 1
!
interface GigabitEthernet1
 ip address 192.0.2.1 255.255.255.0
 ip ospf 1 area 0
!
interface GigabitEthernet2
 description NETAUDIT_UNUSED
 no shutdown
!
line console 0
 exec-timeout 0 0
 no login
!
line vty 0 4
 exec-timeout 0 0
 transport input telnet ssh
!
end
