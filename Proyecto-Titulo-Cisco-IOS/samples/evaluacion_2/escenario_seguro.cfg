! Escenario A: fixture sintetica, no aplicar a dispositivos.
! REDACTED es un marcador sin credenciales; destinos reservados para documentacion.
version 16.9
hostname escenario-a
username usuario-ficticio secret <REDACTED>
enable secret <REDACTED>
no ip http server
ip ssh version 2
ntp server 192.0.2.10
logging host 192.0.2.20
snmp-server community <REDACTED-COMMUNITY> RO
ip access-list extended ACL-SINTETICA
 deny ip any any
!
router ospf 1
!
interface GigabitEthernet1
 description Enlace sintetico para validacion offline
 ip access-group ACL-SINTETICA in
 ip address 192.0.2.1 255.255.255.0
 ip ospf 1 area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <REDACTED-OSPF>
!
interface GigabitEthernet2
 description NETAUDIT_UNUSED
 shutdown
!
line console 0
 exec-timeout 1 30
 login local
!
line vty 0 4
 exec-timeout 1 30
 transport input ssh
!
end
