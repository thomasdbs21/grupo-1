[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-auditor"
version = "0.1.0"
description = "Analizador offline y determinista de configuraciones Cisco IOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ciscoconfparse2>=0.8,<1",
    "fastapi>=0.115,<0.116",
    "netmiko>=4.7,<5",
    "python-multipart>=0.0.20,<0.1",
    "PyYAML>=6,<7",
    "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ios_auditor = ["resources/rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
